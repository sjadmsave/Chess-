name: Build Ruqaa Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_native_stockfish:
        description: "Compile official Stockfish C++ NNUE binary via Android NDK and bundle into APK"
        required: false
        default: true
        type: boolean

jobs:
  build:
    name: Build APK & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Android SDK & Licenses
        shell: bash
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$SDK_DIR"
          export ANDROID_HOME="$SDK_DIR"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"

          # Pre-populate standard Android SDK license hashes so AGP auto-downloads cleanly
          mkdir -p "$SDK_DIR/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e" >> "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" >> "$SDK_DIR/licenses/android-sdk-preview-license"

          SDKMANAGER_BIN="$(command -v sdkmanager || find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          if [ -n "$SDKMANAGER_BIN" ]; then
            (yes || true) | "$SDKMANAGER_BIN" --sdk_root="$SDK_DIR" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER_BIN" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-36.1" "build-tools;36.0.0" > /dev/null 2>&1 || \
              "$SDKMANAGER_BIN" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true
            if [ "${{ github.event_name != 'workflow_dispatch' || inputs.build_native_stockfish == true }}" = "true" ]; then
              "$SDKMANAGER_BIN" --sdk_root="$SDK_DIR" "ndk;27.2.12479018" > /dev/null 2>&1 || true
            fi
          fi

      - name: Build Native Stockfish C++ NNUE (Optional arm64-v8a & x86_64)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_native_stockfish == true }}
        shell: bash
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          NDK_DIR="$SDK_DIR/ndk/27.2.12479018"
          if [ ! -d "$NDK_DIR" ]; then
            NDK_DIR="$(ls -d "$SDK_DIR"/ndk/* 2>/dev/null | head -n 1 || true)"
          fi
          TOOLCHAIN_BIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin"
          if [ ! -d "$TOOLCHAIN_BIN" ]; then
            echo "::warning::NDK toolchain not found; continuing with built-in engine."
            exit 0
          fi

          export ANDROID_NDK_HOME="$NDK_DIR"
          SHIM_DIR="$RUNNER_TEMP/ndk-shims"
          mkdir -p "$SHIM_DIR"
          for name in aarch64-linux-android-clang++ aarch64-linux-android21-clang++ aarch64-linux-android24-clang++; do
            ln -sf "$TOOLCHAIN_BIN/aarch64-linux-android24-clang++" "$SHIM_DIR/$name"
          done
          for name in armv7a-linux-androideabi-clang++ armv7a-linux-androideabi16-clang++ armv7a-linux-androideabi21-clang++ armv7a-linux-androideabi24-clang++; do
            ln -sf "$TOOLCHAIN_BIN/armv7a-linux-androideabi24-clang++" "$SHIM_DIR/$name"
          done
          for name in x86_64-linux-android-clang++ x86_64-linux-android21-clang++ x86_64-linux-android24-clang++; do
            ln -sf "$TOOLCHAIN_BIN/x86_64-linux-android24-clang++" "$SHIM_DIR/$name"
          done
          ln -sf "$TOOLCHAIN_BIN/llvm-strip" "$SHIM_DIR/strip" || true
          export PATH="$SHIM_DIR:$TOOLCHAIN_BIN:$PATH"

          rm -rf "$RUNNER_TEMP/Stockfish"
          if ! git clone --depth 1 https://github.com/official-stockfish/Stockfish.git "$RUNNER_TEMP/Stockfish"; then
            echo "::warning::Could not clone Stockfish repository; continuing with built-in engine."
            exit 0
          fi
          cd "$RUNNER_TEMP/Stockfish/src"

          if make -j"$(nproc)" build ARCH=armv8 COMP=ndk; then
            "$TOOLCHAIN_BIN/llvm-strip" stockfish || true
            mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
            cp stockfish "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libstockfish.so"
            chmod +x "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libstockfish.so"
            echo "::notice::Bundled native Stockfish for arm64-v8a"
          else
            echo "::warning::arm64-v8a Stockfish NDK build failed; continuing with built-in engine."
          fi

          make clean || true
          if make -j"$(nproc)" build ARCH=x86-64 COMP=ndk; then
            "$TOOLCHAIN_BIN/llvm-strip" stockfish || true
            mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/x86_64"
            cp stockfish "$GITHUB_WORKSPACE/app/src/main/jniLibs/x86_64/libstockfish.so"
            chmod +x "$GITHUB_WORKSPACE/app/src/main/jniLibs/x86_64/libstockfish.so"
            echo "::notice::Bundled native Stockfish for x86_64"
          fi

      - name: Prepare Debug Keystore and Gradle Runner
        shell: bash
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ -f gradle/wrapper/gradle-wrapper.jar ] && [ -f gradlew ]; then
            chmod +x gradlew
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
          else
            echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Debug APK
        run: $GRADLE_CMD assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ruqaa-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Run Chess & Engine Unit Tests
        run: $GRADLE_CMD testDebugUnitTest --tests "com.example.ChessEngineAndPuzzlesTest" --tests "com.example.ExampleUnitTest" --no-daemon --stacktrace

      - name: Build Signed Release APK & AAB (Optional if Keystore Secret configured)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_PATH"
          $GRADLE_CMD assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Upload Release APK & AAB Artifacts
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Ruqaa-Release-Outputs
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
